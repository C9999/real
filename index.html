<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R.E.A.L</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0e8de;
      --txt: #5a4a3a;
      --card-shadow: rgba(0,0,0,.07);
      --drawer-bg: #fff;
      --drawer-txt: #5a4a3a;
      --drawer-sub: #a09080;
      --toggle-row-bg: #fafafa;
      --history-item-bg: #fafafa;
      --modal-bg: #fff;
      --modal-q-color: #4a4040;
      --modal-id-color: #c0b0a0;
    }

    /* ── Dark mode ── */
    body.dark {
      --bg: #1a1510;
      --txt: #e8ddd0;
      --card-shadow: rgba(0,0,0,.35);
      --drawer-bg: #231e18;
      --drawer-txt: #e0d4c4;
      --drawer-sub: #8a7a6a;
      --toggle-row-bg: #2e2820;
      --history-item-bg: #2e2820;
      --modal-bg: #231e18;
      --modal-q-color: #ddd0c0;
      --modal-id-color: #6a5a4a;
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background .3s, color .3s;
    }

    /* ── Blobs decorativos ── */
    .blob {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      opacity: .45;
      filter: blur(0px);
    }
    .blob-tl {
      width: 260px; height: 200px;
      top: -60px; left: -70px;
      background: #c8b8a2;
      border-radius: 60% 40% 70% 30% / 50% 60% 40% 70%;
    }
    .blob-tr {
      width: 200px; height: 170px;
      top: -40px; right: -30px;
      background: #d9c3a8;
      border-radius: 40% 60% 30% 70% / 60% 40% 70% 30%;
    }
    .blob-bl {
      width: 180px; height: 220px;
      bottom: 40px; left: -50px;
      background: #a8b89a;
      border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%;
      opacity: .3;
    }
    .blob-br {
      width: 180px; height: 220px;
      bottom: 40px; right: -50px;
      background: #a8b89a;
      border-radius: 50% 50% 60% 40% / 40% 60% 40% 60%;
      opacity: .3;
    }

    /* ── Plantas ── */
    .plant {
      position: fixed;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .6;
    }
    .plant-left  { left: 0; }
    .plant-right { right: 0; transform: scaleX(-1); }

    /* ── Botão menu ── */
    .menu-btn {
      position: fixed;
      top: 16px; left: 16px;
      z-index: 300;
      width: 40px; height: 40px;
      background: rgba(255,255,255,.8);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      backdrop-filter: blur(4px);
      transition: background .2s;
    }
    .menu-btn:hover { background: rgba(255,255,255,.98); }
    .menu-btn span {
      display: block;
      width: 18px; height: 2px;
      background: #6b5c4e;
      border-radius: 2px;
      transition: transform .25s, opacity .25s;
    }
    .menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .menu-btn.open span:nth-child(2) { opacity: 0; }
    .menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* ── Drawer ── */
    .drawer {
      position: fixed;
      top: 0; left: -300px;
      width: 280px; height: 100vh;
      background: var(--drawer-bg);
      z-index: 290;
      box-shadow: 4px 0 20px rgba(0,0,0,.12);
      transition: left .3s ease, background .3s;
      display: flex;
      flex-direction: column;
      padding: 68px 20px 28px;
      overflow-y: auto;
    }
    .drawer.open { left: 0; }
    .drawer-overlay {
      position: fixed; inset: 0;
      z-index: 280;
      background: rgba(0,0,0,.22);
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }

    .drawer h3 {
      font-size: .7rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--drawer-sub);
      margin-bottom: 10px;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--toggle-row-bg);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .9rem;
      color: var(--drawer-txt);
    }
    .switch { position: relative; width: 42px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #ccc;
      border-radius: 22px;
      cursor: pointer;
      transition: background .3s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .3s;
    }
    .switch input:checked + .slider { background: #2d9b8e; }
    .switch input:checked + .slider::before { transform: translateX(20px); }

    /* Histórico */
    .history-empty {
      font-size: .85rem;
      color: var(--drawer-sub);
      font-style: italic;
    }
    .history-item {
      background: var(--history-item-bg);
      border-radius: 8px;
      padding: 9px 11px;
      border-left: 3px solid #ddd;
      margin-bottom: 8px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .history-item:hover { opacity: .8; }
    .history-item .h-cat {
      font-size: .65rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .history-item .h-q {
      font-size: .8rem;
      color: var(--drawer-txt);
      line-height: 1.4;
    }

    /* Lista "Falaremos depois" */
    .depois-item {
      background: var(--history-item-bg);
      border-radius: 8px;
      padding: 9px 11px;
      border-left: 3px solid #e6b800;
      margin-bottom: 8px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .depois-item:hover { opacity: .8; }
    .depois-item .h-cat {
      font-size: .65rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .depois-item .h-q {
      font-size: .8rem;
      color: var(--drawer-txt);
      line-height: 1.4;
    }

    /* ── App container ── */
    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 36px 24px 60px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 44px;
    }
    .logo {
      font-family: 'Georgia', cursive;
      font-size: clamp(2.6rem, 7vw, 3.8rem);
      font-weight: 400;
      letter-spacing: .12em;
      color: var(--txt);
      line-height: 1;
    }
    .logo-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 6px 0 4px;
      color: #b8a090;
    }
    .logo-divider::before,
    .logo-divider::after {
      content: '';
      flex: 1;
      max-width: 70px;
      height: 1px;
      background: #c8b0a0;
    }
    .tagline-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .tagline {
      font-size: .9rem;
      letter-spacing: .22em;
      color: #8a7a6e;
    }
    /* Botão de info ao lado do R.E.A.L */
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-info {
      background: none;
      border: none;
      cursor: pointer;
      color: #c8b090;
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: 50%;
      transition: color .2s;
      margin-top: 4px; /* alinha visualmente com a base do texto */
    }
    .btn-info:hover { color: #5a4a3a; }
    .btn-info svg { width: 20px; height: 20px; }

    /* ── Grid de cartas ── */
    .cards-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      max-width: 980px;
      width: 100%;
    }
    .sorte-row {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }

    /* ── Carta individual ── */
    .card {
      background: var(--card-bg, #eee);
      border-radius: 16px;
      width: clamp(138px, 16vw, 172px);
      aspect-ratio: 3 / 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 18px;
      cursor: pointer;
      position: relative;
      user-select: none;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
      transition: transform .18s, box-shadow .18s, filter .2s, opacity .2s;
    }
    .card:hover:not(.disabled) {
      transform: translateY(-7px) scale(1.03);
      box-shadow: 0 10px 28px rgba(0,0,0,.13);
    }
    .card:active:not(.disabled) { transform: scale(.97); }
    .card.disabled {
      filter: grayscale(1) brightness(.82);
      opacity: .55;
      cursor: not-allowed;
      pointer-events: none;
    }

    .card-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -62%);
      width: 52px; height: 52px;
    }
    .card-icon svg { width: 100%; height: 100%; }

    .card-name {
      font-size: clamp(.75rem, 1.5vw, .9rem);
      letter-spacing: .04em;
      color: #5a4a3a;
      margin-bottom: 8px;
      text-align: center;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      z-index: 400;
      background: rgba(70,55,40,.35);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--modal-bg);
      border-radius: 20px;
      width: min(540px, 100%);
      box-shadow: 0 14px 50px rgba(0,0,0,.18);
      overflow: hidden;
      transform: translateY(20px) scale(.97);
      transition: transform .28s ease, background .3s;
    }
    .modal-overlay.open .modal { transform: none; }

    /* Cabeçalho colorido da modal */
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 14px;
    }
    .modal-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-header-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .modal-header-icons svg { width: 22px; height: 22px; }
    .modal-header-icon-sep {
      font-size: .75rem;
      color: rgba(0,0,0,.25);
      line-height: 1;
    }
    .modal-header-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .modal-close {
      background: rgba(255,255,255,.75);
      border: none;
      border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 1rem;
      cursor: pointer;
      color: #777;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, color .2s;
      font-weight: 700;
    }
    .modal-close:hover { background: #fff; color: #333; }

    /* Modal amarela / verde (faróis) */
    .modal.modo-depois { background: #fffbea; }
    .modal.modo-verde  { background: #f0faf3; }
    body.dark .modal.modo-depois { background: #2a2510; }
    body.dark .modal.modo-verde  { background: #0e2018; }

    /* ── Modal de informações ── */
    .info-overlay {
      position: fixed; inset: 0;
      z-index: 500;
      background: rgba(70,55,40,.4);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    .info-overlay.open { opacity: 1; pointer-events: all; }
    .info-modal {
      background: var(--modal-bg);
      border-radius: 20px;
      width: min(500px, 100%);
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 14px 50px rgba(0,0,0,.2);
      transform: translateY(20px) scale(.97);
      transition: transform .28s ease;
    }
    .info-overlay.open .info-modal { transform: none; }
    .info-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid rgba(128,100,60,.12);
      position: sticky; top: 0;
      background: var(--modal-bg);
    }
    .info-modal-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--txt);
      letter-spacing: .04em;
    }
    .info-modal-body { padding: 22px 24px 28px; }
    .info-subtitle {
      font-size: .8rem;
      letter-spacing: .14em;
      color: #8a7a6e;
      margin-bottom: 20px;
    }
    .info-secao { margin-bottom: 20px; }
    .info-secao h4 {
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #b5882a;
      margin-bottom: 6px;
    }
    .info-secao p {
      font-size: .9rem;
      line-height: 1.65;
      color: var(--modal-q-color);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #3a3028;
      color: #fff;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: .85rem;
      z-index: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.toast-verde   { background: #2e8a4c; }
    .toast.toast-amarelo { background: #9a7200; }
    .toast.toast-vermelho { background: #c03030; }

    /* Corpo da modal */
    .modal-body {
      padding: 32px 28px 0;
      text-align: center;
      position: relative;
    }
    .modal-question {
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.6;
      color: var(--modal-q-color);
      min-height: 72px;
    }
    .modal-question-id {
      display: block;
      text-align: left;
      font-size: .68rem;
      letter-spacing: .08em;
      color: var(--modal-id-color);
      padding: 12px 22px 0;
    }

    /* Faróis */
    .modal-traffic {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 22px 8px;
    }
    .btn-farol {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .2s;
      opacity: .35;
      background: currentColor;
    }
    .btn-farol:hover { opacity: .7; transform: scale(1.1); }
    .btn-farol.ativo { opacity: 1; box-shadow: 0 0 0 3px rgba(255,255,255,.6), 0 0 0 5px currentColor; transform: scale(1.1); }
    .btn-farol-verde  { color: #3aaa5c; }
    .btn-farol-amarelo { color: #e6b800; }
    .btn-farol-vermelho { color: #d94040; }

    /* Rodapé da modal */
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 22px 18px;
    }

    .btn-next {
      background: #c0616b;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 11px 26px;
      font-size: .92rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .04em;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: filter .2s, transform .15s;
    }
    .btn-next:hover  { filter: brightness(1.1); }
    .btn-next:active { transform: scale(.96); }
    .btn-next.hidden { display: none; }

    .modal {
      background: var(--modal-bg);
      border-radius: 20px;
      width: min(540px, 100%);
      box-shadow: 0 14px 50px rgba(0,0,0,.18);
      overflow: hidden;
      transform: translateY(20px) scale(.97);
      transition: transform .28s ease, background .3s;
    }

    /* ── Frase flutuante ── */
    .floating-phrase {
      position: fixed;
      top: 14px; left: 70px;
      z-index: 410;
      background: rgba(255,255,255,.8);
      border-radius: 12px;
      padding: 9px 13px;
      font-size: .78rem;
      color: #8a7060;
      line-height: 1.4;
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      max-width: 155px;
    }
    .floating-phrase.visible { opacity: 1; }

    /* ── Responsivo ── */
    @media (max-width: 600px) {
      /* Linha 1: Relacionamentos | Expectativas
         Linha 2: Sexo (centralizado)
         Linha 3: Acordos | Limites
         Linha 4: Sorte (via .sorte-row, já centralizada) */
      .cards-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "rel  exp"
          "sex  sex"
          "aco  lim";
        gap: 12px;
        width: 100%;
        max-width: 320px;
      }
      .card-slot-relacionamentos { grid-area: rel; }
      .card-slot-expectativas    { grid-area: exp; }
      .card-slot-sexo            { grid-area: sex; display: flex; justify-content: center; }
      .card-slot-acordos         { grid-area: aco; }
      .card-slot-limites         { grid-area: lim; }

      .card { width: 100%; }
      .card-slot-sexo .card { width: clamp(110px, 40vw, 148px); }

      /* Sorte fica no sorte-row separado — garante centralização e tamanho correto */
      .sorte-row .card-slot-sorte { display: flex; justify-content: center; }
      .sorte-row .card-slot-sorte .card { width: clamp(110px, 40vw, 148px); }

      .modal-footer { flex-direction: column; gap: 12px; align-items: stretch; }
      .btn-next { justify-content: center; }
    }
  </style>
</head>
<body>

<!-- Blobs -->
<div class="blob blob-tl"></div>
<div class="blob blob-tr"></div>
<div class="blob blob-bl"></div>
<div class="blob blob-br"></div>

<!-- Plantas decorativas -->
<svg class="plant plant-left" width="130" height="200" viewBox="0 0 130 200" fill="none" aria-hidden="true">
  <g stroke="#7a9a6a" stroke-width="1.6" fill="none" opacity=".8">
    <path d="M45 200 Q42 158 56 128"/>
    <path d="M56 128 Q28 108 8 86"/>
    <path d="M56 128 Q66 102 52 72"/>
    <path d="M52 72 Q24 62 4 42"/>
    <path d="M52 72 Q72 52 62 22"/>
    <path d="M56 128 Q80 112 96 88"/>
  </g>
</svg>
<svg class="plant plant-right" width="130" height="200" viewBox="0 0 130 200" fill="none" aria-hidden="true">
  <g stroke="#7a9a6a" stroke-width="1.6" fill="none" opacity=".8">
    <path d="M45 200 Q42 158 56 128"/>
    <path d="M56 128 Q28 108 8 86"/>
    <path d="M56 128 Q66 102 52 72"/>
    <path d="M52 72 Q24 62 4 42"/>
    <path d="M52 72 Q72 52 62 22"/>
    <path d="M56 128 Q80 112 96 88"/>
  </g>
</svg>

<!-- Menu sanduíche -->
<button class="menu-btn" id="menuBtn" aria-label="Abrir menu" aria-expanded="false">
  <span></span><span></span><span></span>
</button>

<!-- Frase flutuante -->
<div class="floating-phrase" id="floatingPhrase">
  Mais conversas,<br>relações mais reais.
</div>

<!-- Drawer -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<nav class="drawer" id="drawer" aria-label="Menu">

  <h3>Configurações</h3>
  <div class="toggle-row">
    <span class="toggle-label">🔥 Categoria Sexo</span>
    <label class="switch" aria-label="Ativar/desativar categoria Sexo">
      <input type="checkbox" id="toggleSexo" checked />
      <span class="slider"></span>
    </label>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">🌙 Dark mode</span>
    <label class="switch" aria-label="Ativar/desativar Dark mode">
      <input type="checkbox" id="toggleDark" />
      <span class="slider"></span>
    </label>
  </div>

  <h3>Falaremos depois</h3>
  <div id="depoisList">
    <p class="history-empty">Nenhuma carta aqui ainda.</p>
  </div>

  <h3 style="margin-top:18px">Histórico da sessão</h3>
  <div id="historyList">
    <p class="history-empty" id="historyEmpty">Nenhuma pergunta vista ainda.</p>
  </div>
</nav>

<!-- App -->
<div id="app">
  <header>
    <div class="logo-wrap">
      <button class="btn-info" id="btnInfo" aria-label="Sobre o jogo">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="10" cy="10" r="8.5"/>

let perguntas  = {};

/* ═══════════════════════════════════════
   HELPERS
═══════════════════════════════════════ */
function randItem(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}
function randDiff(arr, exclude) {
  if (arr.length <= 1) return arr[0] || null;
  let item; let tries = 0;
  do { item = randItem(arr); tries++; } while (item.id === (exclude && exclude.id) && tries < 20);
  return item;
}

/* ═══════════════════════════════════════
   CARREGA PERGUNTAS
   Tenta fetch do JSON; se falhar (file://),

// @PERGUNTAS_START
const PERGUNTAS_FALLBACK = {"relacionamentos":[{"id":"rel-001","pergunta":"O que faz você se sentir acolhido e valorizado em uma relação?"},{"id":"rel-002","pergunta":"Como você percebe que está criando uma conexão emocional com alguém?"},{"id":"rel-003","pergunta":"Que lugar os relacionamentos românticos, amizades e outros vínculos ocupam na sua vida?"},{"id":"rel-004","pergunta":"O que significa, para você, construir uma relação saudável?"},{"id":"rel-005","pergunta":"Como você costuma demonstrar carinho e como gosta de recebê-lo?"},{"id":"rel-006","pergunta":"De que forma você gostaria que uma pessoa próxima estivesse presente nos momentos difíceis?"},{"id":"rel-007","pergunta":"O que você aprendeu sobre relacionamentos que gostaria de levar para as suas conexões atuais?"},{"id":"rel-008","pergunta":"Como você lida com mudanças na intensidade ou na forma de uma relação ao longo do tempo?"},{"id":"rel-009","pergunta":"O que ajuda você a manter sua individualidade enquanto constrói intimidade com alguém?"},{"id":"rel-010","pergunta":"Como seria, para você, uma rede de afeto em que diferentes vínculos pudessem coexistir com respeito?"}],"expectativas":[{"id":"exp-001","pergunta":"O que você espera de uma relação neste momento da sua vida?"},{"id":"exp-002","pergunta":"Quais expectativas você costuma criar no início de uma conexão e como conversa sobre elas?"},{"id":"exp-003","pergunta":"Como você gostaria de equilibrar tempo a sós, amizades, trabalho e relacionamentos?"},{"id":"exp-004","pergunta":"O que compromisso significa para você, independentemente do formato da relação?"},{"id":"exp-005","pergunta":"Como você se sente em relação às etapas tradicionais dos relacionamentos, como morar junto ou casar?"},{"id":"exp-006","pergunta":"O que você gostaria que as pessoas entendessem sobre suas necessidades afetivas?"},{"id":"exp-007","pergunta":"Como você prefere agir quando percebe que suas expectativas e as de outra pessoa são diferentes?"},{"id":"exp-008","pergunta":"Que tipo de presença e frequência de contato fazem você se sentir conectado a alguém?"},{"id":"exp-009","pergunta":"Como você gostaria de conversar quando seus sentimentos ou desejos mudarem?"},{"id":"exp-010","pergunta":"O que seria importante alinhar antes de aprofundar uma relação ou iniciar uma nova conexão?"}],"acordos":[{"id":"aco-001","pergunta":"Como você diferencia um acordo construído em conjunto de uma regra imposta?"},{"id":"aco-002","pergunta":"Quais assuntos considera importante conversar antes de se envolver com outras pessoas?"},{"id":"aco-003","pergunta":"Como vocês poderiam revisar um acordo quando as necessidades de alguém mudarem?"},{"id":"aco-004","pergunta":"Que tipo de transparência sobre outras conexões faz sentido para você?"},{"id":"aco-005","pergunta":"Como você gostaria de combinar cuidados com saúde sexual entre as pessoas envolvidas?"},{"id":"aco-006","pergunta":"Que informações você gostaria de compartilhar — ou prefere não compartilhar — sobre outros encontros?"},{"id":"aco-007","pergunta":"Como podemos garantir que todas as pessoas afetadas por um acordo tenham voz na conversa?"},{"id":"aco-008","pergunta":"Como você gostaria de lidar com um acordo que deixou de funcionar para alguém?"},{"id":"aco-009","pergunta":"Que combinados práticos ajudariam a organizar tempo, privacidade e compromissos entre diferentes vínculos?"},{"id":"aco-010","pergunta":"Como você gostaria que uma pessoa avisasse que não conseguirá cumprir um acordo, ou que deseja renegociá-lo?"}],"limites":[{"id":"lim-001","pergunta":"Como você percebe que um limite pessoal seu precisa ser comunicado?"},{"id":"lim-002","pergunta":"O que ajuda você a dizer “não” sem sentir que precisa justificar excessivamente sua decisão?"},{"id":"lim-003","pergunta":"Como você prefere que alguém reaja quando você expressa desconforto ou muda de ideia?"},{"id":"lim-004","pergunta":"Que aspectos da sua privacidade são importantes preservar em qualquer relação?"},{"id":"lim-005","pergunta":"Como você diferencia um limite pessoal de uma tentativa de controlar as escolhas de outra pessoa?"},{"id":"lim-006","pergunta":"O que você precisa para se sentir seguro ao falar de ciúmes, inseguranças ou vulnerabilidades?"},{"id":"lim-007","pergunta":"Como gostaria de agir se perceber que um limite seu foi ultrapassado?"},{"id":"lim-008","pergunta":"Que situações fazem você precisar de mais espaço ou tempo para si?"},{"id":"lim-009","pergunta":"Como podemos respeitar limites diferentes sem tratar as necessidades de alguém como menos importantes?"},{"id":"lim-010","pergunta":"O que ajuda você a reconhecer e respeitar o limite de outra pessoa, mesmo quando não o compreende totalmente?"}],"sexo":[{"id":"sex-001","pergunta":"O que ajuda você a se sentir confortável e presente durante uma experiência íntima?"},{"id":"sex-002","pergunta":"Como você prefere conversar sobre desejos, curiosidades e fantasias?"},{"id":"sex-003","pergunta":"O que torna mais fácil para você comunicar consentimento, desconforto ou vontade de parar?"},{"id":"sex-004","pergunta":"Como você gostaria de conversar sobre saúde sexual, prevenção e testagem com uma pessoa parceira?"},{"id":"sex-005","pergunta":"O que significa, para você, respeitar o ritmo e o desejo de cada pessoa na intimidade?"},{"id":"sex-006","pergunta":"Como você se sente ao falar sobre diferenças de desejo sexual entre pessoas parceiras?"},{"id":"sex-007","pergunta":"Que formas de intimidade, além do sexo, fazem você se sentir próximo de alguém?"},{"id":"sex-008","pergunta":"Como você gostaria que uma pessoa perguntasse sobre algo novo que deseja experimentar com você?"},{"id":"sex-009","pergunta":"Que cuidados com privacidade e confidencialidade são importantes para você ao falar sobre experiências íntimas?"},{"id":"sex-010","pergunta":"Como você gostaria de conversar depois de uma experiência íntima para compartilhar o que foi bom e o que poderia ser diferente?"}],"sorte":[]};

async function carregarPerguntas() {
  try {
    const res = await fetch('perguntas.json');
    if (!res.ok) throw new Error('Falha no fetch');
    const data = await res.json();
    for (const [key, val] of Object.entries(data.categorias)) {
      perguntas[key] = val.perguntas || [];
    }
  } catch (e) {
    // fallback para dados embutidos
    for (const [key, arr] of Object.entries(PERGUNTAS_FALLBACK)) {
      perguntas[key] = arr;
    }
  }
}

async function carregarTexto() {
  try {
    const res = await fetch('texto.json');
    if (!res.ok) throw new Error('Falha no fetch');
    infoData = await res.json();
  } catch (e) {
    infoData = null;
  }
}

/* ═══════════════════════════════════════
   RENDERIZA CARTAS
═══════════════════════════════════════ */
function criarCarta(chave, disabled) {
  const m = META[chave];
  const card = document.createElement('div');
  card.className = 'card' + (disabled ? ' disabled' : '');
  card.style.setProperty('--card-bg', m.cardBg);
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', disabled ? '-1' : '0');
  card.setAttribute('aria-label', m.nome);
  card.innerHTML = `
    <div class="card-icon" style="color:${m.cor}">${m.icon}</div>
    <span class="card-name" style="color:${m.cor}">${m.nome}</span>`;
  if (!disabled) {
    const acao = chave === 'sorte' ? () => abrirSorte() : () => abrirCategoria(chave);
    card.addEventListener('click', acao);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') acao(); });
  }
  // wrapper para grid-area no mobile
  const slot = document.createElement('div');
  slot.className = `card-slot-${chave}`;
  slot.appendChild(card);
  return slot;
}

function renderCartas() {
  const row   = document.getElementById('cardsRow');
  const sorte = document.getElementById('sorteRow');
  row.innerHTML   = '';
  sorte.innerHTML = '';

  const principais = ['relacionamentos', 'expectativas', 'acordos', 'limites', 'sexo'];
  for (const key of principais) {
    const dis = key === 'sexo' && !sexoAtivo;
    row.appendChild(criarCarta(key, dis));
  }
  sorte.appendChild(criarCarta('sorte', false));
}

/* ═══════════════════════════════════════
   LÓGICA DA MODAL
═══════════════════════════════════════ */
function abrirCategoria(chave) {
  const lista = perguntas[chave] || [];
  if (!lista.length) {
    alert('Nenhuma pergunta cadastrada nessa categoria ainda.');
    return;
  }
  catAtual  = chave;
  viaSort   = false;
  pergAtual = randItem(lista);
  mostrarModal(chave, pergAtual, false);
}

function abrirSorte() {
  const disponiveis = ['relacionamentos','expectativas','acordos','limites','sexo']
    .filter(k => {
      if (k === 'sexo' && !sexoAtivo) return false;
      return (perguntas[k] || []).length > 0;
    });
  if (!disponiveis.length) {
    alert('Nenhuma categoria com perguntas disponível.');
    return;
  }
  const chave = randItem(disponiveis);
  catAtual  = chave;
  viaSort   = true;
  pergAtual = randItem(perguntas[chave]);
  mostrarModal(chave, pergAtual, true);
}

function mostrarModal(chave, pergObj, isSorte) {
  const m       = META[chave];
  const mSorte  = META['sorte'];

  // Cor do header: verde (sorte) ou cor da categoria
  const corHeader = isSorte ? mSorte.bg  : m.bg;
  const corTxt    = isSorte ? mSorte.cor : m.cor;

  document.getElementById('modalHeader').style.background = corHeader;
  document.getElementById('modalTitle').textContent        = m.nome;
  document.getElementById('modalTitle').style.color        = corTxt;

  // Ícones no header
  const iconsEl = document.getElementById('modalHeaderIcons');
  if (isSorte) {
    iconsEl.innerHTML = `
      <span style="color:${m.cor}">${m.icon}</span>
      <span class="modal-header-icon-sep">+</span>
      <span style="color:${mSorte.cor}">${mSorte.icon}</span>`;
  } else {
    iconsEl.innerHTML = `<span style="color:${m.cor}">${m.icon}</span>`;
  }

  // Pergunta e ID
  document.getElementById('modalQuestion').textContent   = pergObj.pergunta;
  document.getElementById('modalQuestionId').textContent = pergObj.id;

  // Botão Próxima: escondido em Sorte, visível nas categorias
  const btnNext = document.getElementById('btnNext');
  if (isSorte) {
    btnNext.classList.add('hidden');
  } else {
    btnNext.classList.remove('hidden');
    btnNext.style.background = m.cor;
  }

  // Reseta faróis
  farolAtivo = null;
  document.getElementById('farolVerde').classList.remove('ativo');
  document.getElementById('farolAmarelo').classList.remove('ativo');
  document.getElementById('farolVermelho').classList.remove('ativo');
  document.querySelector('.modal').classList.remove('modo-depois', 'modo-verde');

  adicionarHistorico(chave, pergObj, isSorte);

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('floatingPhrase').classList.add('visible');
  document.getElementById('modalClose').focus();
}

function fecharModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('floatingPhrase').classList.remove('visible');
  catAtual  = null;
  pergAtual = null;
  viaSort   = false;
}

function proximaPergunta() {
  // Avança para outra pergunta da mesma categoria
  if (!catAtual) return;
  const lista = perguntas[catAtual] || [];
  if (!lista.length) return;
  const nova = randDiff(lista, pergAtual);
  pergAtual  = nova;
  document.getElementById('modalQuestion').textContent  = nova.pergunta;
  document.getElementById('modalQuestionId').textContent = nova.id;
  // Reseta faróis
  farolAtivo = null;
  document.getElementById('farolVerde').classList.remove('ativo');
  document.getElementById('farolAmarelo').classList.remove('ativo');
  document.getElementById('farolVermelho').classList.remove('ativo');
  document.querySelector('.modal').classList.remove('modo-depois', 'modo-verde');
  adicionarHistorico(catAtual, nova, false);
}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
function mostrarToast(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-' + tipo + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); }, 2800);
}

/* ═══════════════════════════════════════
   FARÓIS
═══════════════════════════════════════ */
function acionarFarol(cor) {
  // Deseleciona se clicar no mesmo
  if (farolAtivo === cor) {
    farolAtivo = null;
    document.getElementById('farol' + cor.charAt(0).toUpperCase() + cor.slice(1)).classList.remove('ativo');
    document.querySelector('.modal').classList.remove('modo-depois', 'modo-verde');
    return;
  }

  // Remove estado anterior
  ['Verde','Amarelo','Vermelho'].forEach(c =>
    document.getElementById('farol' + c).classList.remove('ativo')
  );
  document.querySelector('.modal').classList.remove('modo-depois', 'modo-verde');

  farolAtivo = cor;
  document.getElementById('farol' + cor.charAt(0).toUpperCase() + cor.slice(1)).classList.add('ativo');

  if (cor === 'verde') {
    document.querySelector('.modal').classList.add('modo-verde');
    mostrarToast('Aprofunde mais sobre essa carta 🌱', 'verde');

  } else if (cor === 'amarelo') {
    document.querySelector('.modal').classList.add('modo-depois');
    // Adiciona à lista "depois" se ainda não estiver lá
    if (catAtual && pergAtual) {
      const jaExiste = depoisList.some(d => d.id === pergAtual.id && d.chave === catAtual);
      if (!jaExiste) {
        depoisList.push({ chave: catAtual, id: pergAtual.id, texto: pergAtual.pergunta, isSorte: viaSort });
        renderDepois();
      }
    }
    mostrarToast('Falaremos dessa carta mais tarde 🟡', 'amarelo');
    setTimeout(() => fecharModal(), 1200);

  } else if (cor === 'vermelho') {
    // Remove do histórico se foi adicionado
    if (pergAtual) {
      historico = historico.filter(h => !(h.id === pergAtual.id && h.chave === catAtual));
      renderHistorico();
    }
    mostrarToast('Não falaremos mais sobre essa carta 🔴', 'vermelho');
    setTimeout(() => fecharModal(), 900);
  }
}

/* ═══════════════════════════════════════
   LISTA "FALAREMOS DEPOIS"
═══════════════════════════════════════ */
function renderDepois() {
  const el = document.getElementById('depoisList');
  if (!depoisList.length) {
    el.innerHTML = '<p class="history-empty">Nenhuma carta aqui ainda.</p>';
    return;
  }
  el.innerHTML = depoisList.map((item, idx) => {
    const m = META[item.chave];
    return `<div class="depois-item" data-idx="${idx}">
              <div class="h-cat" style="color:#b38a00">${m.nome}</div>
              <div class="h-q">${item.texto}</div>
            </div>`;
  }).join('');
  // Clique reabre a pergunta com cor amarela
  el.querySelectorAll('.depois-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx  = parseInt(el.dataset.idx);
      const item = depoisList[idx];
      catAtual  = item.chave;
      pergAtual = { id: item.id, pergunta: item.texto };
      viaSort   = item.isSorte;
      mostrarModal(item.chave, pergAtual, item.isSorte);
      // Aplica farol amarelo automaticamente ao abrir da lista "depois"
      setTimeout(() => {
        document.querySelector('.modal').classList.add('modo-depois');
        document.getElementById('farolAmarelo').classList.add('ativo');
        farolAtivo = 'amarelo';
      }, 50);
      fecharMenu();
    });
  });
}

/* ═══════════════════════════════════════
   DARK MODE
═══════════════════════════════════════ */
function aplicarDark(ativo) {
  darkMode = ativo;
  document.body.classList.toggle('dark', ativo);
}

/* ═══════════════════════════════════════
   MODAL DE INFORMAÇÕES
═══════════════════════════════════════ */
function abrirInfo() {
  const overlay = document.getElementById('infoOverlay');
  if (infoData) {
    document.getElementById('infoTitulo').textContent   = infoData.titulo || 'Sobre o jogo';
    document.getElementById('infoSubtitulo').textContent = infoData.subtitulo || '';
    const secoesEl = document.getElementById('infoSecoes');
    if (infoData.descricao) {
      secoesEl.innerHTML = `<div class="info-secao"><p>${infoData.descricao}</p></div>`;
    } else {
      secoesEl.innerHTML = '';
    }
    if (infoData.secoes) {
      secoesEl.innerHTML += infoData.secoes.map(s =>
        `<div class="info-secao"><h4>${s.titulo}</h4><p>${s.texto}</p></div>`
      ).join('');
    }
  }
  overlay.classList.add('open');
}
function fecharInfo() {
  document.getElementById('infoOverlay').classList.remove('open');
}

/* ═══════════════════════════════════════
   HISTÓRICO
═══════════════════════════════════════ */
function adicionarHistorico(chave, pergObj, isSorte) {
  if (historico.length) {
    const last = historico[historico.length - 1];
    if (last.chave === chave && last.id === pergObj.id) return;
  }
  historico.push({ chave, id: pergObj.id, texto: pergObj.pergunta, isSorte });
  renderHistorico();
}

function renderHistorico() {
  const lista = document.getElementById('historyList');
  if (!historico.length) {
    lista.innerHTML = '<p class="history-empty" id="historyEmpty">Nenhuma pergunta vista ainda.</p>';
    return;
  }
  lista.innerHTML = [...historico].reverse().map(item => {
    const m = META[item.chave];
    const label = item.isSorte ? `${m.nome} · Sorte` : m.nome;
    return `<div class="history-item" style="border-left-color:${m.cor}">
              <div class="h-cat" style="color:${m.cor}">${label}</div>
              <div class="h-q">${item.texto}</div>
            </div>`;
  }).join('');
}

/* ═══════════════════════════════════════
   EVENTOS
═══════════════════════════════════════ */
// Toggle Sexo
document.getElementById('toggleSexo').addEventListener('change', function() {
  sexoAtivo = this.checked;
  renderCartas();
});

// Toggle Dark
document.getElementById('toggleDark').addEventListener('change', function() {
  aplicarDark(this.checked);
});

// Menu
const menuBtn       = document.getElementById('menuBtn');
const drawer        = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');

function abrirMenu() {
  drawer.classList.add('open');
  drawerOverlay.classList.add('open');
  menuBtn.classList.add('open');
  menuBtn.setAttribute('aria-expanded', 'true');
}
function fecharMenu() {
  drawer.classList.remove('open');
  drawerOverlay.classList.remove('open');
  menuBtn.classList.remove('open');
  menuBtn.setAttribute('aria-expanded', 'false');
}
menuBtn.addEventListener('click', () =>
  drawer.classList.contains('open') ? fecharMenu() : abrirMenu()
);
drawerOverlay.addEventListener('click', fecharMenu);

// Modal de perguntas
document.getElementById('modalClose').addEventListener('click', fecharModal);
document.getElementById('btnNext').addEventListener('click', proximaPergunta);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) fecharModal();
});

// Faróis
document.getElementById('farolVerde').addEventListener('click',    () => acionarFarol('verde'));
document.getElementById('farolAmarelo').addEventListener('click',  () => acionarFarol('amarelo'));
document.getElementById('farolVermelho').addEventListener('click', () => acionarFarol('vermelho'));

// Botão info
document.getElementById('btnInfo').addEventListener('click', abrirInfo);
document.getElementById('infoClose').addEventListener('click', fecharInfo);
document.getElementById('infoOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('infoOverlay')) fecharInfo();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { fecharModal(); fecharMenu(); fecharInfo(); }
});

/* ═══════════════════════════════════════
   INICIALIZAÇÃO
═══════════════════════════════════════ */
(async () => {
  await Promise.all([carregarPerguntas(), carregarTexto()]);
  renderCartas();
  renderHistorico();
  renderDepois();
})();
</script>
</body>
</html>
